<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sudoku Solver</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>


    <div class = "sudoku-layout">

        <div class = "grid-container">

            {% for i in range(81) %}

                <div class = "grid-item"></div>

            {% endfor %}

        </div>


        <div class = "numpad">

            <div class = "np-modes">

                <div class = "np-normal-mode">Normal</div>
                <div class = "np-pencil-mode">Pencil</div>
                <div class="np-spacer"></div>
                <div class = "np-undo-button">Undo</div>
                
            </div>

            <div class = "np-numbers">

                {% for i in range(9) %}

                    <div class = "np-number-item">{{ i + 1 }}</div>

                {% endfor %}

                <div class = "np-x-button">X</div>

            </div>


        </div>

    </div>


    <script src="{{ url_for('static', filename='sudoku.js') }}"></script>
</body>



</html>
